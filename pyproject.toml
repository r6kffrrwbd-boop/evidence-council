[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-council"
version = "0.2.0"
description = "Compare independent AI proposals, verify their claims against objective evidence, and return a justified verdict."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "evidence-council contributors" }]
dependencies = [
  # Exact pins live in requirements.lock; these ranges keep `pip install .` working.
  "jsonschema>=4.20,<5",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
evidence-council = "evidence_council.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_council = ["schemas/*.json", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real: runs against real, locally available AI providers (opt-in: EC_REAL=1)",
]
addopts = "-m 'not real'"
